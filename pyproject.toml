[project]
name = "secretary"
version = "0.1.0"
description = "Self-hosted voice dictation and note-taking with local Whisper and a local LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.39",
    "fastapi[standard]>=0.128.0",
    "faster-whisper>=1.1.0",
    "llama-cpp-python>=0.3.0",
    "python-dotenv>=1.2.1",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.14.14",
]
aws = ["boto3>=1.42.39"]

[tool.pyright]
include = ["."]
exclude = [
    "client",
    "static",
    "**/__pycache__",
    ".venv",
]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

# llama-cpp-python publishes only an sdist to PyPI, so installing from there
# compiles llama.cpp from source. Pull it from the upstream author's prebuilt
# wheel index instead. `explicit` binds this index to that one package, so
# nothing else resolves through it.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu/"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
