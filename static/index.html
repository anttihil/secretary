<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secretary</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Notes</h2>
        <button class="btn-new-note" onclick="showNewNoteModal()">+ New</button>
      </div>
      <div class="notes-list" id="notesList"></div>
      <div class="sidebar-footer">
        <button class="btn-command-mode" onclick="showCommandView()">
          Command Mode
        </button>
      </div>
    </div>

    <!-- Main panel -->
    <div class="main-panel">
      <!-- Command view -->
      <div class="command-view" id="commandView">
        <h1>Secretary</h1>
        <div class="controls">
          <button
            class="btn-command"
            id="cmdBtnRecord"
            onclick="startRecording('command')"
          >
            Record Command
          </button>
          <button
            class="btn-stop"
            id="cmdBtnStop"
            onclick="stopRecording()"
            style="display: none"
          >
            Stop
          </button>
        </div>
        <div class="status">
          <span class="recording-dot" id="cmdRecDot"></span>
          <span id="cmdStatusText">Connecting...</span>
        </div>
        <div class="results" id="cmdResults"></div>
      </div>

      <!-- Note view -->
      <div class="note-view view-hidden" id="noteView">
        <div class="note-header">
          <button class="btn-back" onclick="closeNote()">&larr;</button>
          <h1 id="noteTitle"></h1>
          <button class="btn-delete" onclick="deleteCurrentNote()">
            Delete
          </button>
        </div>
        <div class="note-controls">
          <button
            class="btn-record"
            id="noteBtnRecord"
            onclick="startRecording('note')"
          >
            Record
          </button>
          <button
            class="btn-stop"
            id="noteBtnStop"
            onclick="stopRecording()"
            style="display: none"
          >
            Stop
          </button>
        </div>
        <div class="status">
          <span class="recording-dot" id="noteRecDot"></span>
          <span id="noteStatusText"></span>
        </div>
        <div class="note-body" id="noteBody"></div>
        <div class="results" id="noteResults" style="margin-top: 1rem"></div>
      </div>
    </div>

    <!-- New note modal -->
    <div class="modal-overlay" id="newNoteModal">
      <div class="modal">
        <h2>New Note</h2>
        <input
          type="text"
          id="newNoteTitle"
          placeholder="Note title..."
          autofocus
        />
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="hideNewNoteModal()">
            Cancel
          </button>
          <button class="btn-create" onclick="createNote()">Create</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
